name: Job market

on:
  push:
    paths:
      - 'job_market/**'
      - '.github/workflows/job-market.yml'
  pull_request:
    paths:
      - 'job_market/**'
      - '.github/workflows/job-market.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job_market
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: make check PYTHON=python
