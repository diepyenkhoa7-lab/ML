# Kiểm tra kỹ thuật bằng mẫu minh họa, không dùng để báo cáo chất lượng model.
model: models/gemma-mlx-4bit
train: true
fine_tune_type: lora
data: data/examples/finetune
adapter_path: adapters/gemma-smoke
seed: 42
num_layers: 4
batch_size: 1
iters: 20
val_batches: 1
learning_rate: 0.0001
steps_per_report: 5
steps_per_eval: 10
save_every: 20
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
