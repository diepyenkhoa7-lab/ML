# Full training data: script computes iterations from train rows x requested epochs.
model: models/gemma-mlx-4bit
train: true
fine_tune_type: lora
data: data/finetune_full/v1.0.0
adapter_path: adapters/gemma-jobs
seed: 42
num_layers: 4
batch_size: 1
iters: 364
val_batches: -1
learning_rate: 0.0001
steps_per_report: 10
steps_per_eval: 364
save_every: 100
max_seq_length: 1024
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
