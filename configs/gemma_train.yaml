# Trial đầu tiên: chỉ chạy sau khi người dùng xác nhận kế hoạch.
model: models/gemma-mlx-4bit
train: true
fine_tune_type: lora
data: data/finetune
adapter_path: adapters/gemma-jobs
seed: 42
num_layers: 4
batch_size: 1
iters: 100
val_batches: 5
learning_rate: 0.0001
steps_per_report: 5
steps_per_eval: 25
save_every: 25
max_seq_length: 1024
grad_checkpoint: true
mask_prompt: true
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0
